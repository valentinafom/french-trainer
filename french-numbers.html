<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#FFFFE3" />
  <link rel="manifest" href="manifest.json" />
  <title>Les nombres en français</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Page-specific styles for french-numbers.html */
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #223;
      font-size: .85rem;
      font-weight: 650;
    }

    #rangesDropdown {
      min-width: 260px;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="navbar">
      <a href="index.html">Home</a>
      <div class="dropdown">
        <button class="dropbtn">Other exercises</button>
        <div class="dropdown-content">
          <!-- Auto-populated by common.js -->
        </div>
      </div>
    </div>

    <div class="card">
      <!-- Folded by default (no "open") -->
      <details id="settings">
        <summary>Settings</summary>

        <div class="spacer"></div>



        


        <div class="row" style="margin-bottom:12px;">
          <div>
            <label for="min">Min</label><br />
            <input id="min" type="number" value="0" min="0" max="2000000000" />
          </div>
          <div>
            <label for="max">Max</label><br />
            <input id="max" type="number" value="100" min="0" max="2000000000" />
          </div>
        </div>

        

        <div class="row" style="margin-top:12px;">
          <div>
            <label for="mode">Mode</label><br />
            <select id="mode">
              <option value="numToFr">Le Nombre → Français</option>
              <option value="frToNum">Français → Le Nombre</option>
            </select>
          </div>
          <div class="field">
            <label for="showAccents">Strict spelling?</label>
            <select id="showAccents">
              <option value="no" selected>No (ignore accents & punctuation)</option>
              <option value="yes">Yes (strict)</option>
            </select>
          </div>
        </div>
        <p class="tiny" style="margin-top:10px;">
          Spelling matches 1990 rectified orthography: e.g. vingt-et-un,
          soixante-et-onze, cent-un, deux-cents,
          deux-mille, un-million, un-milliard
        </p>

        <div class="row" style="margin-top:14px; flex-wrap:wrap; gap:8px;">
          <label class="score-control chk" title="Study mode - auto reveal answers">
            <input type="checkbox" id="study" />
            Study mode
          </label>
          <label class="score-control chk" title="Random order">
            <input type="checkbox" id="random" />
            Random
          </label>
          <label class="score-control chk" title="Speak slower">
            <input type="checkbox" id="slowSpeak" />
            Slow
          </label>
          <label class="score-control chk" title="Auto pronounce French">
            <input type="checkbox" id="pronounce" />
            Pronounce
          </label>
        </div>

      </details>

    </div>

    <div class="card">
      <div class="row controls-container" style="margin-top:12px;">

        <div class="dropdown">
          <button onclick="toggleRanges()" class="dropbtn" style="padding: 8px 12px;">
            Quick ranges ▾
          </button>
          <div id="rangesDropdown" class="dropdown-content">
            <button class="dropdown-item secondary" id="range0_20" type="button">0–20</button>
            <button class="dropdown-item secondary" id="range21_69" type="button">21–69</button>
            <button class="dropdown-item secondary" id="range70_100" type="button">70–100</button>
            <button class="dropdown-item secondary" id="range_grands" type="button">
              Les grands nombres
            </button>
            <hr>
            <button class="dropdown-item tertiary" id="range100_1000" type="button">100–1000</button>
            <button class="dropdown-item tertiary" id="range1000_10000" type="button">1000–10000</button>
            <button class="dropdown-item tertiary" id="range10000_9999999" type="button">
              10000–9999999
            </button>
            <button class="dropdown-item tertiary" id="range10000000_2000000000" type="button">
              10000000–2000000000
            </button>
          </div>
        </div>

        <div class="score-control">
          <span id="scorePill">Score: 0/0</span>
        </div>
        <div class="score-control" title="Press X to reset score">
          <span id="progressPill">Numbers: 0/0</span>
          <button id="resetScoreBtn" type="button" aria-label="Reset score">✖</button>
        </div>
      </div>

      <div id="promptArea" style="margin-top: 14px;">
        <div class="big" id="bigPrompt"></div>
        <div class="french muted" id="smallPrompt" style="margin-top: 12px;"></div>
      </div>

      <div class="row no-wrap" style="margin-top: 12px;">
        <input id="answer" type="text" placeholder="" autocomplete="off" />
        <button id="checkBtn" title="press (enter) to check" type="button">Check</button>
      </div>

      <div class="prev-row" id="prevRow">
        <div class="feedback" id="feedback"></div>
        <div class="tiny" id="extra"></div>
      </div>



      <div class="row" style="margin-top:12px;">
        <button class="secondary" id="revealBtn" title="press (r) to Reveal" type="button">Reveal</button>
        <button class="secondary" id="speakBtn" title="press (s) to Pronounce" type="button">🔊 Listen</button>

      </div>

    </div>

  </div>

  <script src="common.js"></script>
  <script>
    class FrenchNumbersTrainer {
      constructor() {
        this.units = [
          "zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf",
          "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"
        ];
        this.teens = { 17: "dix-sept", 18: "dix-huit", 19: "dix-neuf" };
        this.tens = { 20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante" };

        this.GRAND_NUMBERS = [
          100, 101, 200, 202, 300, 305, 400, 500, 600, 700, 800, 900,
          1000, 2000, 10000, 100000, 1000000, 2000000, 1000000000, 2000000000
        ];

        this.currentNumber = null;
        this.currentFrench = null;
        this.total = 0;
        this.correct = 0;
        this.allowHotkeysInAnswer = false;
        this.useGrandNumbersSet = false;

        this.history = [];
        this.historyIndex = -1;
        this.seqIndex = null;

        this.LS_MODE_KEY = "ft_mode";
        this.LS_RANGE_KEY = "ft_range";
        this.LS_GRANDS_KEY = "ft_useGrandNumbers";

        this.settingsDetailsEl = document.getElementById("settings");
        this.minEl = el("min");
        this.maxEl = el("max");
        this.modeEl = el("mode");
        this.answerEl = el("answer");
        this.feedbackEl = el("feedback");
        this.extraEl = el("extra");
        this.bigPromptEl = el("bigPrompt");
        this.smallPromptEl = el("smallPrompt");
        this.scorePillEl = el("scorePill");
        this.progressPillEl = el("progressPill");
        this.wordsSeenSet = new Set();
        this.acceptAccentsEl = el("showAccents");
        this.slowSpeakEl = el("slowSpeak");
        this.pronounceEl = el("pronounce");
        this.studyEl = el("study");
        this.randomEl = el("random");
        this.prevBtnEl = el("prevBtn");

        this.checkBtnEl = el("checkBtn");
        this._checkedState = false;

        this.init();
      }

      init() {
        this.setupEventListeners();
        this.loadSettingsFromStorage();
        this.setCard();
        this.updateScore();
      }

      fr0to99(n) {
        if (n < 0 || n > 99) throw new Error("out of range");
        if (n <= 16) return this.units[n];
        if (n in this.teens) return this.teens[n];
        if (n < 20) return "dix-" + this.units[n - 10];

        if (n < 70) {
          const t = Math.floor(n / 10) * 10;
          const u = n % 10;
          const base = this.tens[t];
          if (u === 0) return base;
          if (u === 1) return base + "-et-un";
          return base + "-" + this.units[u];
        }

        if (n < 80) {
          const rest = n - 60; 
          if (rest === 11) return "soixante-et-onze";
          return "soixante-" + this.fr0to99(rest);
        }

        const rest = n - 80;
        const base = (rest === 0) ? "quatre-vingts" : "quatre-vingt";
        if (rest === 0) return base;
        if (rest === 1) return base + "-un";
        if (rest < 17) return base + "-" + this.units[rest];
        return base + "-" + this.fr0to99(rest);
      }

      fr0to999(n) {
        if (n < 0 || n > 999) throw new Error("out of range");
        if (n < 100) return this.fr0to99(n);

        const h = Math.floor(n / 100);
        const rest = n % 100;

        let hundred = (h === 1) ? "cent" : (this.units[h] + "-cent");
        if (rest === 0 && h > 1) hundred += "s";
        if (rest === 0) return hundred;

        return hundred + "-" + this.fr0to99(rest);
      }

      fr0to999999(n) {
        if (n < 0 || n > 999999) throw new Error("out of range");
        if (n < 1000) return this.fr0to999(n);

        const k = Math.floor(n / 1000);
        const rest = n % 1000;

        const thousandPart = (k === 1) ? "mille" : (this.fr0to999(k) + "-mille");
        if (rest === 0) return thousandPart;

        return thousandPart + " " + this.fr0to999(rest);
      }

      fr0to999999999(n) {
        if (n < 0 || n > 999999999) throw new Error("out of range");
        if (n < 1000000) return this.fr0to999999(n);

        const m = Math.floor(n / 1000000);
        const rest = n % 1000000;

        const millionPart = (m === 1) ? "un-million" : (this.fr0to999(m) + "-millions");
        if (rest === 0) return millionPart;

        return millionPart + " " + this.fr0to999999(rest);
      }

      fr0to2000000000(n) {
        if (n < 0 || n > 2000000000) throw new Error("out of range");
        if (n < 1000000000) return this.fr0to999999999(n);

        const b = Math.floor(n / 1000000000);
        const rest = n % 1000000000;

        const milliardPart = (b === 1) ? "un-milliard" : (this.fr0to999(b) + "-milliards");
        if (rest === 0) return milliardPart;

        return milliardPart + " " + this.fr0to999999999(rest);
      }

      normalise(s) {
        return s
          .trim()
          .toLowerCase()
          .replace(/['']/g, "'")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      comparable(s, acceptAccents) {
        const n = this.normalise(s);
        return acceptAccents ? stripDiacritics(n) : n; 
      }

      shouldAutoPronounce() {
        return !!this.pronounceEl?.checked;
      }

      randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      clampRange() {
        let min = Number(this.minEl.value);
        let max = Number(this.maxEl.value);
        if (Number.isNaN(min)) min = 0;
        if (Number.isNaN(max)) max = 100;

        if (min < 0) min = 0;
        if (max > 2000000000) max = 2000000000;

        if (min > max) [min, max] = [max, min];

        this.minEl.value = String(min);
        this.maxEl.value = String(max);
        return { min, max };
      }

      setRange(min, max) {
        this.useGrandNumbersSet = false;
        this.wordsSeenSet.clear();
        this.minEl.value = String(min);
        this.maxEl.value = String(max);
        this.saveSettingsToStorage();
        this.setCard();
      }

      setCard(navigateOpts = {}) {
        const { min, max } = this.clampRange();

        if (navigateOpts.goBack) {
            if (this.historyIndex > 0) {
                this.historyIndex--;
                this.applyStateFromHistory(this.history[this.historyIndex]);
            }
            return;
        }

        if (this.historyIndex < this.history.length - 1 && this.historyIndex >= 0) {
            this.history = this.history.slice(0, this.historyIndex + 1);
        }

        const isRandom = !!this.randomEl?.checked;

        if (isRandom) {
            this.currentNumber = this.useGrandNumbersSet ? pick(this.GRAND_NUMBERS) : this.randInt(min, max);
        } else {
            if (this.useGrandNumbersSet) {
                if (this.seqIndex === null) this.seqIndex = -1;
                this.seqIndex = (this.seqIndex + 1) % this.GRAND_NUMBERS.length;
                this.currentNumber = this.GRAND_NUMBERS[this.seqIndex];
            } else {
                if (this.seqIndex === null || this.seqIndex < min || this.seqIndex > max) this.seqIndex = min - 1;
                this.seqIndex++;
                if (this.seqIndex > max) this.seqIndex = min;
                this.currentNumber = this.seqIndex;
            }
        }

        this.currentFrench = this.fr0to2000000000(this.currentNumber);

        this.history.push({
            currentNumber: this.currentNumber,
            currentFrench: this.currentFrench
        });
        this.historyIndex = this.history.length - 1;

        this.renderCard();
      }

      applyStateFromHistory(state) {
          this.currentNumber = state.currentNumber;
          this.currentFrench = state.currentFrench;
          this.renderCard();
      }

      renderCard() {
        const mode = this.modeEl.value;
        const isStudy = !!this.studyEl?.checked;

        if (isStudy) {
          if (mode === "numToFr") {
            this.bigPromptEl.textContent = this.currentNumber.toLocaleString("en-GB");
            this.smallPromptEl.textContent = this.currentFrench;
          } else {
            this.bigPromptEl.textContent = this.currentFrench;
            this.smallPromptEl.textContent = this.currentNumber.toLocaleString("en-GB");
          }
          this.answerEl.placeholder = "Study mode…";
          this.extraEl.innerHTML = "";
        } else if (mode === "numToFr") {
          this.bigPromptEl.textContent = this.currentNumber.toLocaleString("en-GB");
          this.smallPromptEl.textContent = "";
          this.answerEl.placeholder = "Type the French…";
        } else {
          this.bigPromptEl.textContent = "";
          this.smallPromptEl.textContent = this.currentFrench;
          this.answerEl.placeholder = "Type the number…";
        }

        this.answerEl.value = "";
        this.allowHotkeysInAnswer = false;
        if (this.checkBtnEl) {
            this.checkBtnEl.textContent = "Check";
            this.checkBtnEl.title = "press (enter) to check";
        }
        this.isChecked = false;
        this.answerEl.focus();

        // Reset feedback on new card
        if (this.feedbackEl) { this.feedbackEl.textContent = ""; this.feedbackEl.className = "feedback"; }
        if (this.extraEl) this.extraEl.innerHTML = "";

        // Update progress but don't mark as seen until revealed/checked
        this.updateProgress();

        if (this.shouldAutoPronounce()) {
          this.speak();
        }
      }

      goPrevious() {
        this.setCard({ goBack: true });
      }

      updateScore() {
        this.scorePillEl.textContent = `Score: ${this.correct}/${this.total}`;
      }

      updateProgress() {
        if (!this.progressPillEl) return;
        const { min, max } = this.clampRange();
        const total = max - min + 1;
        const done = Math.min(this.wordsSeenSet.size, total);
        this.progressPillEl.textContent = `Numbers: ${done}/${total}`;
      }

      reveal() {
        if (this.currentNumber === null) return;
        
        this.wordsSeenSet.add(this.currentNumber);
        this.updateProgress();

        const mode = this.modeEl.value;
        const isStudy = !!this.studyEl?.checked;

        if (isStudy) {
          if (mode === "numToFr") {
            this.bigPromptEl.textContent = this.currentNumber.toLocaleString("en-GB");
            this.smallPromptEl.textContent = this.currentFrench;
          } else {
            this.bigPromptEl.textContent = this.currentFrench;
            this.smallPromptEl.textContent = this.currentNumber.toLocaleString("en-GB");
          }

          if (this.currentFrench) {
             this.wordsSeenSet.add(this.currentFrench);
             this.updateProgress();
          }

          this.extraEl.innerHTML = "";
          return;
        }

        if (mode === "numToFr") {
          this.smallPromptEl.textContent = this.currentFrench;
          this.extraEl.textContent = "Tip: try to say it aloud once, then type it.";
        } else {
          this.bigPromptEl.textContent = this.currentNumber.toLocaleString("en-GB");
          this.extraEl.textContent = "Tip: notice patterns (70/80/90).";
        }
      }

      check() {
        foldSettings(this.settingsDetailsEl);
        if (this.currentNumber === null) return;

        const mode = this.modeEl.value;
        const acceptAccents = this.acceptAccentsEl.value === "yes";
        const userRaw = this.answerEl.value;

        let ok = false;

        if (mode === "numToFr") {
          ok = this.comparable(userRaw, acceptAccents) === this.comparable(this.currentFrench, acceptAccents);
        } else {
          const parsed = parseInt(String(userRaw).replace(/,/g, ""), 10);
          ok = String(parsed) === String(this.currentNumber);
        }

        this.total += 1;
        if (ok) this.correct += 1;

        this.feedbackEl.textContent = ok ? "✓" : "✖";
        this.feedbackEl.className = "feedback " + (ok ? "ok" : "bad");

        if (mode === "numToFr") {
          this.smallPromptEl.innerHTML = formatHints(this.currentFrench);
          this.extraEl.innerHTML = `Expected: <span class="expected">${escapeHtml(this.currentFrench)}</span> <br>[${this.currentNumber.toLocaleString("en-GB")}]`;
        } else {
          this.bigPromptEl.innerHTML = this.currentNumber.toLocaleString("en-GB");
          this.extraEl.innerHTML = `Expected: <span class="expected">${this.currentNumber.toLocaleString("en-GB")}</span> <br>[${escapeHtml(this.currentFrench)}]`;
        }

        this.updateScore();
        this.allowHotkeysInAnswer = true;
        if (this.checkBtnEl) {
            this.checkBtnEl.textContent = "Next";
            this.checkBtnEl.title = "press (enter) for new card";
        }
        this.isChecked = true;
      }

      next() {
        this.setCard();
      }

      handleCheckBtn() {
        if (this.isChecked) {
            this.next();
        } else {
            this.check();
        }
      }

      speak() {
        if (this.currentNumber === null) return;
        const slow = !!this.slowSpeakEl?.checked;
        speakFrench(this.currentFrench, slow);
      }

      resetScore() {
        this.total = 0;
        this.correct = 0;
        this.updateScore();
        this.feedbackEl.textContent = "Score cleared.";
        this.feedbackEl.className = "feedback muted";
      }

      loadSettingsFromStorage() {
        const savedMode = localStorage.getItem(this.LS_MODE_KEY);
        if (savedMode) this.modeEl.value = savedMode;

        const savedRange = localStorage.getItem(this.LS_RANGE_KEY);
        if (savedRange) {
          try {
            const { min, max } = JSON.parse(savedRange);
            this.minEl.value = min;
            this.maxEl.value = max;
          } catch { }
        }

        const savedGrands = localStorage.getItem(this.LS_GRANDS_KEY);
        this.useGrandNumbersSet = savedGrands === "true";

        const randomSaved = localStorage.getItem("ft_numbers_random");
        if (randomSaved !== null && this.randomEl) {
          this.randomEl.checked = randomSaved === "true";
        }
      }

      saveSettingsToStorage() {
        localStorage.setItem(this.LS_MODE_KEY, this.modeEl.value);
        localStorage.setItem(this.LS_RANGE_KEY, JSON.stringify({
          min: this.minEl.value,
          max: this.maxEl.value
        }));
        localStorage.setItem(this.LS_GRANDS_KEY, String(this.useGrandNumbersSet));
        if (this.randomEl) {
          localStorage.setItem("ft_numbers_random", String(this.randomEl.checked));
        }
      }

      toggleRanges() {
        document.getElementById("rangesDropdown").classList.toggle("show");
      }

      closeRangesDropdown() {
        document.getElementById("rangesDropdown")?.classList.remove("show");
      }

      setupEventListeners() {
        el("revealBtn").addEventListener("click", () => this.reveal());
        this.checkBtnEl?.addEventListener("click", () => this.handleCheckBtn());
        el("speakBtn")?.addEventListener("click", () => this.speak());
        el("resetScoreBtn").addEventListener("click", () => this.resetScore());

        const rangeMapper = (id, min, max) => {
          el(id)?.addEventListener("click", () => {
            this.setRange(min, max);
            this.closeRangesDropdown();
          });
        };

        rangeMapper("range0_20", 0, 20);
        rangeMapper("range21_69", 21, 69);
        rangeMapper("range70_100", 70, 100);
        rangeMapper("range100_1000", 100, 1000);
        rangeMapper("range1000_10000", 1000, 10000);
        rangeMapper("range10000_9999999", 10000, 9999999);
        rangeMapper("range10000000_2000000000", 10000000, 2000000000);

        el("range_grands")?.addEventListener("click", () => {
          this.useGrandNumbersSet = true;
          this.wordsSeenSet.clear();
          this.minEl.value = "100";
          this.maxEl.value = "2000000000";
          this.saveSettingsToStorage();
          this.closeRangesDropdown();
          this.setCard();
        });

        this.modeEl.addEventListener("change", () => {
          this.saveSettingsToStorage();
          this.setCard();
        });
        
        this.minEl.addEventListener("change", () => {
          this.wordsSeenSet.clear();
          this.useGrandNumbersSet = false;
          this.saveSettingsToStorage();
        });
        
        this.maxEl.addEventListener("change", () => {
          this.wordsSeenSet.clear();
          this.useGrandNumbersSet = false;
          this.saveSettingsToStorage();
        });

        if (this.studyEl) {
          this.studyEl.addEventListener("change", () => {
            if (this.studyEl.checked) {
              document.body.classList.add("study-mode");
            } else {
              document.body.classList.remove("study-mode");
            }
            this.feedbackEl.textContent = "";
            this.feedbackEl.className = "feedback";
            this.setCard();
          });
        }

        if (this.randomEl) {
          this.randomEl.addEventListener("change", () => {
             this.saveSettingsToStorage();
             this.seqIndex = null;
             this.setCard();
          });
        }

        if (this.prevBtnEl) this.prevBtnEl.addEventListener("click", () => this.goPrevious());

        this.answerEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            this.handleCheckBtn();
          }
        });

        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey || e.metaKey || e.altKey) return;

          const active = document.activeElement;
          const isEditable = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);

          if (isEditable) {
            const isAnswerInput = active === this.answerEl;
            if (!(isAnswerInput && this.allowHotkeysInAnswer)) return;
          }

          switch (e.key.toLowerCase()) {
            case "n": e.preventDefault(); this.setCard(); break;
            case "p": e.preventDefault(); this.goPrevious(); break;
            case "r": e.preventDefault(); this.reveal(); break;
            case "s": e.preventDefault(); this.speak(); break;
            case "x": e.preventDefault(); this.resetScore(); break;
          }
        });

        window.addEventListener("click", (e) => {
          const dropdown = document.getElementById("rangesDropdown");
          const dropdownContainer = dropdown?.parentElement;
          if (dropdownContainer && !dropdownContainer.contains(e.target)) {
            if (dropdown.classList.contains("show")) {
              dropdown.classList.remove("show");
            }
          }
        });
      }
    }

    // Expose toggleRanges specifically to the inline button click event
    let trainerInstance;
    document.addEventListener("DOMContentLoaded", () => {
        trainerInstance = new FrenchNumbersTrainer();
    });

    function toggleRanges() {
        if (trainerInstance) trainerInstance.toggleRanges();
    }
  </script>
</body>

</html>
