<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Les nombres en français</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Page-specific styles for french-numbers.html */
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #223;
      font-size: .85rem;
      font-weight: 650;
    }

    #rangesDropdown {
      min-width: 260px;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="navbar">
      <a href="index.html">Home</a>
      <a href="french-numbers.html">Numbers</a>
      <div class="dropdown">
        <button class="dropbtn">Other exercises</button>
        <div class="dropdown-content">
          <!-- Auto-populated by common.js -->
        </div>
      </div>
    </div>

    <div class="card">
      <!-- Folded by default (no "open") -->
      <details id="settings">
        <summary>Settings</summary>

        <div class="spacer"></div>



        


        <div class="row" style="margin-bottom:12px;">
          <div>
            <label for="min">Min</label><br />
            <input id="min" type="number" value="0" min="0" max="2000000000" />
          </div>
          <div>
            <label for="max">Max</label><br />
            <input id="max" type="number" value="100" min="0" max="2000000000" />
          </div>
        </div>

        

        <div class="row" style="margin-top:12px;">
          <div>
            <label for="mode">Mode</label><br />
            <select id="mode">
              <option value="numToFr">Le Nombre → Français</option>
              <option value="frToNum">Français → Le Nombre</option>
            </select>
          </div>
          <div class="field">
            <label for="showAccents">Strict spelling?</label>
            <select id="showAccents">
              <option value="no" selected>No (ignore accents & punctuation)</option>
              <option value="yes">Yes (strict)</option>
            </select>
          </div>
        </div>
        <p class="tiny" style="margin-top:10px;">
          Spelling matches 1990 rectified orthography: e.g. vingt-et-un,
          soixante-et-onze, cent-un, deux-cents,
          deux-mille, un-million, un-milliard
        </p>
      </details>

    </div>

    <div class="card">
      <div class="row" style="margin-top:12px;">


        <div class="score-control" title="Press X to reset score">
          <span id="scorePill">Score: 0/0</span>
          <button id="resetScoreBtn" type="button" aria-label="Reset score">✖</button>
        </div>

        <label class="score-control chk" title="Speak slower">
          <input type="checkbox" id="slowSpeak" />
          Slow
        </label>

        <label class="score-control chk" title="Auto pronounce French">
          <input type="checkbox" id="pronounce" />
          Pronounce
        </label>

        <div class="dropdown">
          <button onclick="toggleRanges()" class="dropbtn">
            Quick ranges ▾
          </button>
        
          <div id="rangesDropdown" class="dropdown-content">
            <button class="dropdown-item secondary" id="range0_20" type="button">0–20</button>
            <button class="dropdown-item secondary" id="range21_69" type="button">21–69</button>
            <button class="dropdown-item secondary" id="range70_100" type="button">70–100</button>
            <button class="dropdown-item secondary" id="range_grands" type="button">
              Les grands nombres
            </button>
        
            <hr>
        
            <button class="dropdown-item tertiary" id="range100_1000" type="button">100–1000</button>
            <button class="dropdown-item tertiary" id="range1000_10000" type="button">1000–10000</button>
            <button class="dropdown-item tertiary" id="range10000_9999999" type="button">
              10000–9999999
            </button>
            <button class="dropdown-item tertiary" id="range10000000_2000000000" type="button">
              10000000–2000000000
            </button>
          </div>
        </div>
      </div>
      <div id="promptArea" style="margin-top: 14px;">
        <div class="big" id="bigPrompt"></div>
        <div class="french muted" id="smallPrompt"></div>
      </div>

      <div class="row no-wrap" style="margin-top: 12px;">
        <input id="answer" type="text" placeholder="" autocomplete="off" />
        <button id="checkBtn" title="press (enter) to check / press (n) for new card" type="button">Check /
          Next</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="tiny" id="extra"></div>

      <div class="row" style="margin-top:12px;">

        <button class="secondary" id="revealBtn" title="press (r) to Reveal" type="button">Reveal</button>
        <button class="secondary" id="speakBtn" title="press (s) to Pronounce" type="button">🔊 Listen</button>
      </div>

    </div>

  </div>

  <script src="common.js"></script>
  <script>
    const units = [
      "zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf",
      "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"
    ];
    const teens = { 17: "dix-sept", 18: "dix-huit", 19: "dix-neuf" };
    const tens = { 20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante" };

    function fr0to99(n) {
      if (n < 0 || n > 99) throw new Error("out of range");
      if (n <= 16) return units[n];
      if (n in teens) return teens[n];
      if (n < 20) return "dix-" + units[n - 10];

      if (n < 70) {
        const t = Math.floor(n / 10) * 10;
        const u = n % 10;
        const base = tens[t];
        if (u === 0) return base;
        if (u === 1) return base + "-et-un";
        return base + "-" + units[u];
      }

      // 70–79 = 60 + (10–19)
      if (n < 80) {
        const rest = n - 60; // 10..19
        if (rest === 11) return "soixante-et-onze"; // special "et"
        // soixante-dix, soixante-douze, soixante-dix-sept, etc.
        return "soixante-" + fr0to99(rest);
      }

      // 80–99 = quatre-vingt(s) + rest
      const rest = n - 80;
      const base = (rest === 0) ? "quatre-vingts" : "quatre-vingt";
      if (rest === 0) return base;
      if (rest === 1) return base + "-un";
      if (rest < 17) return base + "-" + units[rest];
      return base + "-" + fr0to99(rest);
    }

    function fr0to999(n) {
      if (n < 0 || n > 999) throw new Error("out of range");
      if (n < 100) return fr0to99(n);

      const h = Math.floor(n / 100);
      const rest = n % 100;

      let hundred = (h === 1) ? "cent" : (units[h] + "-cent");

      // plural "cents" only when exact multiple of 100 and > 100
      if (rest === 0 && h > 1) hundred += "s";
      if (rest === 0) return hundred;

      // chart uses hyphen: cent-un, trois-cent-cinq, etc.
      return hundred + "-" + fr0to99(rest);
    }

    function fr0to999999(n) {
      if (n < 0 || n > 999999) throw new Error("out of range");
      if (n < 1000) return fr0to999(n);

      const k = Math.floor(n / 1000);
      const rest = n % 1000;

      const thousandPart = (k === 1) ? "mille" : (fr0to999(k) + "-mille");
      if (rest === 0) return thousandPart;

      // Keep a space between groups for readability (still accepts hyphen-only input)
      return thousandPart + " " + fr0to999(rest);
    }

    function fr0to999999999(n) {
      if (n < 0 || n > 999999999) throw new Error("out of range");
      if (n < 1000000) return fr0to999999(n);

      const m = Math.floor(n / 1000000);
      const rest = n % 1000000;

      const millionPart = (m === 1) ? "un-million" : (fr0to999(m) + "-millions");
      if (rest === 0) return millionPart;

      return millionPart + " " + fr0to999999(rest);
    }

    function fr0to2000000000(n) {
      if (n < 0 || n > 2000000000) throw new Error("out of range");
      if (n < 1000000000) return fr0to999999999(n);

      const b = Math.floor(n / 1000000000);
      const rest = n % 1000000000;

      const milliardPart = (b === 1) ? "un-milliard" : (fr0to999(b) + "-milliards");
      if (rest === 0) return milliardPart;

      return milliardPart + " " + fr0to999999999(rest);
    }

    // --- Answer normalisation (specific to numbers) ---
    function normalise(s) {
      return s
        .trim()
        .toLowerCase()
        .replace(/['']/g, "'")
        // accept either spaces or hyphens from learners; compare in a hyphen-first form
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-+|-+$/g, "");
    }
    function comparable(s, acceptAccents) {
      const n = normalise(s);
      return acceptAccents ? stripDiacritics(n) : n; // Uses stripDiacritics from common.js
    }

    // el() is now imported from common.js
    const settingsDetailsEl = document.getElementById("settings");
    const minEl = el("min");
    const maxEl = el("max");
    const modeEl = el("mode");
    const answerEl = el("answer");
    const feedbackEl = el("feedback");
    const extraEl = el("extra");
    const bigPromptEl = el("bigPrompt");
    const smallPromptEl = el("smallPrompt");
    const scorePillEl = el("scorePill");
    const acceptAccentsEl = el("showAccents");
    const slowSpeakEl = el("slowSpeak");
    const pronounceEl = el("pronounce");

    function shouldAutoPronounce() {
      return !!pronounceEl?.checked;
    }

    let currentNumber = null;
    let currentFrench = null;
    let total = 0;
    let correct = 0;
    let allowHotkeysInAnswer = false;

    const GRAND_NUMBERS = [
      100, 101,
      200, 202,
      300, 305,
      400, 500, 600, 700, 800, 900,
      1000, 2000,
      10000, 100000,
      1000000, 2000000,
      1000000000, 2000000000
    ];

    let useGrandNumbersSet = false;

    // pick() is now imported from common.js

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function clampRange() {
      let min = Number(minEl.value);
      let max = Number(maxEl.value);
      if (Number.isNaN(min)) min = 0;
      if (Number.isNaN(max)) max = 100;

      if (min < 0) min = 0;
      if (max > 2000000000) max = 2000000000;

      if (min > max) [min, max] = [max, min];

      minEl.value = String(min);
      maxEl.value = String(max);
      return { min, max };
    }

    function setRange(min, max) {
      useGrandNumbersSet = false;
      minEl.value = String(min);
      maxEl.value = String(max);
      saveSettingsToStorage();
      setCard();
    }


    // foldSettings() is now imported from common.js

    function setCard() {
      const { min, max } = clampRange();
      currentNumber = useGrandNumbersSet ? pick(GRAND_NUMBERS) : randInt(min, max);
      currentFrench = fr0to2000000000(currentNumber);

      const mode = modeEl.value;

      if (mode === "numToFr") {
        bigPromptEl.textContent = currentNumber.toLocaleString("en-GB");
        smallPromptEl.textContent = "";
        answerEl.placeholder = "Type the French…";
      } else {
        bigPromptEl.textContent = "";
        smallPromptEl.textContent = currentFrench;
        answerEl.placeholder = "Type the number…";
      }

      answerEl.value = "";
      allowHotkeysInAnswer = false;
      answerEl.focus();

      if (shouldAutoPronounce()) {
        speak();
      }
    }

    function updateScore() {
      scorePillEl.textContent = `Score: ${correct}/${total}`;
    }

    function reveal() {
      if (currentNumber === null) return;
      const mode = modeEl.value;

      if (mode === "numToFr") {
        smallPromptEl.textContent = currentFrench;
        extraEl.textContent = "Tip: try to say it aloud once, then type it.";
      } else {
        bigPromptEl.textContent = currentNumber.toLocaleString("en-GB");
        extraEl.textContent = "Tip: notice patterns (70/80/90).";
      }
    }

    function check() {
      foldSettings(settingsDetailsEl);
      if (currentNumber === null) return;

      const mode = modeEl.value;
      const acceptAccents = acceptAccentsEl.value === "yes";
      const userRaw = answerEl.value;

      let ok = false;

      if (mode === "numToFr") {
        ok = comparable(userRaw, acceptAccents) === comparable(currentFrench, acceptAccents);
      } else {
        const parsed = parseInt(String(userRaw).replace(/,/g, ""), 10);
        ok = String(parsed) === String(currentNumber);
      }

      total += 1;
      if (ok) correct += 1;

      feedbackEl.textContent = ok ? "✓ Correct!" : "✖ Not quite.";
      feedbackEl.className = "feedback " + (ok ? "ok" : "bad");

      if (mode === "numToFr") {
        smallPromptEl.textContent = currentFrench;
        extraEl.innerHTML = `Expected: <span class="expected">${currentFrench}</span> [${currentNumber.toLocaleString("en-GB")}]`;

      } else {
        bigPromptEl.textContent = currentNumber.toLocaleString("en-GB");
        extraEl.innerHTML = `Expected: <span class="expected">${currentNumber.toLocaleString("en-GB")}</span> [${currentFrench}]`;
      }

      updateScore();
      allowHotkeysInAnswer = true;
      setCard();
    }
    // Speech synthesis functions are now imported from common.js
    function speak() {
      if (currentNumber === null) return;
      const slow = !!slowSpeakEl?.checked;
      speakFrench(currentFrench, slow);
    }


    function resetScore() {
      total = 0;
      correct = 0;
      updateScore();
      feedbackEl.textContent = "Score cleared.";
      feedbackEl.className = "feedback muted";
    }

    // --- Events ---
    el("revealBtn").addEventListener("click", reveal);
    el("checkBtn").addEventListener("click", check);
    el("speakBtn").addEventListener("click", speak);
    el("resetScoreBtn").addEventListener("click", resetScore);

    el("range0_20").addEventListener("click", () => {
  setRange(0, 20); saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range21_69").addEventListener("click", () => {
      setRange(21, 69); saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range70_100").addEventListener("click", () => {setRange(70, 100);saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range100_1000").addEventListener("click", () => {setRange(100, 1000); saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range1000_10000").addEventListener("click", () => {setRange(1000, 10000); saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range10000_9999999").addEventListener("click", () => {setRange(10000, 9999999); saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range10000000_2000000000").addEventListener("click", () => {setRange(10000000, 2000000000);saveSettingsToStorage();setCard();
  closeRangesDropdown();
});
    el("range_grands").addEventListener("click", () => { useGrandNumbersSet = true; minEl.value = "100"; maxEl.value = "2000000000"; saveSettingsToStorage(); closeRangesDropdown(); setCard(); });

    modeEl.addEventListener("change", () => {
      saveSettingsToStorage();
      setCard();
    });
    minEl.addEventListener("change", () => {
      useGrandNumbersSet = false;
      saveSettingsToStorage();
    });

    maxEl.addEventListener("change", () => {
      useGrandNumbersSet = false;
      saveSettingsToStorage();
    });


    answerEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        check();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const active = document.activeElement;
      const isEditable =
        active &&
        (active.tagName === "INPUT" ||
          active.tagName === "TEXTAREA" ||
          active.isContentEditable);

      if (isEditable) {
        const isAnswerInput = active === answerEl;
        if (!(isAnswerInput && allowHotkeysInAnswer)) return;
      }

      switch (e.key.toLowerCase()) {
        case "n": e.preventDefault(); setCard(); break;
        case "r": e.preventDefault(); reveal(); break;
        case "s": e.preventDefault(); speak(); break;
        case "x": e.preventDefault(); resetScore(); break;
      }
    });

    // --- LocalStorage keys ---
    const LS_MODE_KEY = "ft_mode";
    const LS_RANGE_KEY = "ft_range";
    const LS_GRANDS_KEY = "ft_useGrandNumbers";


    function loadSettingsFromStorage() {
      // Mode
      const savedMode = localStorage.getItem(LS_MODE_KEY);
      if (savedMode) {
        modeEl.value = savedMode;
      }

      // Range
      const savedRange = localStorage.getItem(LS_RANGE_KEY);
      if (savedRange) {
        try {
          const { min, max } = JSON.parse(savedRange);
          minEl.value = min;
          maxEl.value = max;
        } catch { }
      }

      // Les grands nombres
      const savedGrands = localStorage.getItem(LS_GRANDS_KEY);
      useGrandNumbersSet = savedGrands === "true";
    }

    function saveSettingsToStorage() {
      // Mode
      localStorage.setItem(LS_MODE_KEY, modeEl.value);

      // Range
      localStorage.setItem(
        LS_RANGE_KEY,
        JSON.stringify({
          min: minEl.value,
          max: maxEl.value
        })
      );

      // Les grands nombres
      localStorage.setItem(LS_GRANDS_KEY, String(useGrandNumbersSet));
    }

    // Speech synthesis initialization is now in common.js

    loadSettingsFromStorage();
    setCard();
    updateScore();

    function toggleRanges() {
  document.getElementById("rangesDropdown").classList.toggle("show");
}

// Close dropdown if user clicks outside
window.addEventListener("click", function (e) {
  const dropdown = document.getElementById("rangesDropdown");
  const dropdownContainer = dropdown?.parentElement;

  // Check if click is outside the dropdown container
  if (dropdownContainer && !dropdownContainer.contains(e.target)) {
    if (dropdown.classList.contains("show")) {
      dropdown.classList.remove("show");
    }
  }
});

function closeRangesDropdown() {
  document.getElementById("rangesDropdown")?.classList.remove("show");
}

  </script>
</body>

</html>
