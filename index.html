<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFFFE3" />
  <link rel="manifest" href="manifest.json" />
  <title>French Practice</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #334155;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .sub {
      text-align: center;
      color: #6D8196;
      margin-bottom: 28px;
    }

    /* Vertical tabs (W3Schools-style) */
    .tab {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border: 1px solid #e2e8f0;
    }

    .tab button {
      display: block;
      width: 100%;
      background: #f8fafc;
      border: 1px solid transparent;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 12px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #334155;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    .tab button:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .tab button:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .tab button.active {
      background: #6366f1;
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
  </style>
</head>

<body>


  <div class="wrap">

    <div id="google_translate_element"></div>
    <h1>French Practice</h1>
    <p class="sub">Choose a trainer</p>

    <div class="tab">
      <!-- Auto-populated by common.js from NAV_PAGES -->
    </div>
  </div>

  <script src="common.js"></script>

  <script
  async
  src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

  

</body>
</html>
