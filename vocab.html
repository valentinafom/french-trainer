<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#FFFFE3" />
    <link rel="manifest" href="manifest.json" />
    <title>Thematic vocabulary</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrap">
        <div class="navbar">
            <a href="index.html">Home</a>
            <div class="dropdown">
                <button class="dropbtn">Other exercises</button>
                <div class="dropdown-content">
                    <!-- Auto-populated by common.js -->
                </div>
            </div>
        </div>

        <div class="card">
            <details id="settings">
                <summary>Settings</summary>
                <div class="spacer"></div>

                <div class="row" style="margin-bottom:12px;">
                    <div>
                        <label for="prefLang">Language</label><br />
                        <select id="prefLang">
                            <option value="en" selected>English</option>
                            <option value="ru">Русский</option>
                        </select>
                    </div>

                    <div>
                        <label for="mode">Mode</label><br />
                        <select id="mode">
                            <option value="promptA_to_answerB">English → French</option>
                            <option value="promptB_to_answerA">French → English</option>
                        </select>
                    </div>

                    <div>
                        <label for="strict">Strict spelling?</label><br />
                        <select id="strict">
                            <option value="no" selected>No (ignore accents & punctuation)</option>
                            <option value="yes">Yes (strict)</option>
                        </select>
                    </div>
                </div>
                <div id="mobileTopicAnchor" style="display: none; margin-top: 12px;"></div>

                <div id="formsBox" style="margin-top:12px;">
                    <div class="tiny" style="margin-bottom:8px; font-weight:700;">Gender & Number filters</div>

                    <div class="row">
                        <label class="score-control chk" title="Masculine">
                            <input type="checkbox" id="gender_m" />
                            Masculine
                        </label>

                        <label class="score-control chk" title="Feminine">
                            <input type="checkbox" id="gender_f" />
                            Feminine
                        </label>
                    </div>

                    <div class="row" style="margin-top:10px;">
                        <label class="score-control chk" title="Singular">
                            <input type="checkbox" id="qty_s" checked />
                            Singular
                        </label>

                        <label class="score-control chk" title="Plural">
                            <input type="checkbox" id="qty_p" />
                            Plural
                        </label>
                    </div>

                    <div class="tiny" style="margin-top:8px;" id="formsHint"></div>
                </div>

                <div class="row" style="margin-top:14px; flex-wrap:wrap; gap:8px;">
                    <label class="score-control chk" title="Study mode - auto reveal answers">
                        <input type="checkbox" id="study" />
                        Study mode
                    </label>
                    <label class="score-control chk" title="Random order">
                        <input type="checkbox" id="random" />
                        Random
                    </label>
                    <label class="score-control chk" title="Speak slower">
                        <input type="checkbox" id="slowSpeak" />
                        Slow
                    </label>
                    <label class="score-control chk" title="Auto pronounce French">
                        <input type="checkbox" id="pronounce" />
                        Pronounce
                    </label>
                </div>

            </details>
        </div>

        <div class="card">
            <div class="set-title" id="setTitleFr"></div>

            <div class="row controls-container" style="margin-top:12px;">

                <div class="dropdown">
                    <button onclick="toggleTopics()" class="dropbtn" style="padding: 8px 12px;">
                        <span id="currentTopicLabel">Topics</span> ▾
                    </button>
                    <div id="topicsDropdown" class="dropdown-content">
                        <!-- Topics will be populated by JavaScript -->
                    </div>
                </div>

                <div class="score-control">
                    <span id="scorePill">Score: 0/0</span>
                </div>
                <div class="score-control" title="Press X to reset score">
                    <span id="progressPill">Words: 0/0</span>
                    <button id="resetScoreBtn" type="button" aria-label="Reset score">✖</button>
                </div>
            </div>

            <div id="promptArea" style="margin-top: 14px;">
                <div class="big" id="bigPrompt"></div>
                <div class="small" id="smallPrompt" style="margin-top: 12px;"></div>
            </div>

            <div class="row no-wrap" style="margin-top: 12px;">
                <input id="answer" type="text" placeholder="Type your answer…" autocomplete="off" />
                <button id="checkBtn" title="press (enter) to check" type="button">Check</button>
            </div>

            <div class="prev-row" id="prevRow">
                <div class="feedback" id="feedback"></div>
                <div class="tiny" id="extra"></div>
            </div>

            <div class="button-row" style="margin-top:12px;">
                <button class="secondary" id="speakBtn" title="press (s) to Pronounce" type="button">🔊 Listen</button>
                <button class="secondary" id="prevBtn" title="press (p) for previous card" type="button">Previous</button>
                <button class="secondary" id="revealBtn" title="press (r) to Reveal" type="button">Reveal</button>

            </div>


        </div>

        <div class="card" id="ruleCard" style="display:none;">
            <details id="ruleDetails">
                <summary id="ruleSummaryTitle">Rule</summary>
                <div class="spacer"></div>
                <div class="tiny" id="ruleBody"></div>
            </details>
        </div>

    </div>

    <script src="common.js"></script>
    <script src="vocab-trainer.js"></script>
    <script>
        // Vocab page supports multiple topic sets with a dropdown
        const TOPIC_FILES = [
            "data/days.js",
            "data/months.js",
            "data/colours.js",
            "data/professions.js",
            "data/animals.js"
        ];

        let TOPIC_SETS = [];
        const DEFAULT_SET_ID = "days";
        const LS_TOPIC_KEY = "ft_vocabTopicSet";
        
        let trainerInstance = null;

        // Override initVocabTrainer to support multiple topics
        async function initVocabPage() {
            // Load all topic sets
            for (const file of TOPIC_FILES) {
                try {
                    const set = await loadJsonSet(file);
                    if (set) TOPIC_SETS.push(set);
                } catch (e) {
                    console.error(`Failed to load ${file}:`, e);
                }
            }

            if (TOPIC_SETS.length === 0) {
                document.getElementById("bigPrompt").textContent = "Failed to load vocabulary data";
                return;
            }

            // Initialize trainer instance with first set
            trainerInstance = new VocabTrainer(TOPIC_SETS[0]);

            initTopicDropdown();
            loadTopicSelection();
        }

        function getTopicName(set) {
            const lang = document.getElementById("prefLang")?.value || "en";
            if (lang === "ru" && set.name_ru) return set.name_ru;
            return set.name;
        }

        function initTopicDropdown() {
            const customDropdown = document.getElementById("topicsDropdown");
            if (!customDropdown) return;

            customDropdown.innerHTML = "";

            for (const set of TOPIC_SETS) {
                const btn = document.createElement("button");
                btn.className = "dropdown-item secondary";
                btn.type = "button";
                btn.textContent = getTopicName(set);
                btn.dataset.topicId = set.id;
                btn.addEventListener("click", () => {
                    selectTopic(set.id);
                    closeTopicsDropdown();
                });
                customDropdown.appendChild(btn);
            }

            // Set initial label
            const current = TOPIC_SETS[0];
            if (current) {
                document.getElementById("currentTopicLabel").textContent = getTopicName(current);
            }
        }

        function selectTopic(topicId) {
            const set = TOPIC_SETS.find(s => s.id === topicId);
            if (!set || !trainerInstance) return;

            // Update the trainer instance's data set
            trainerInstance.updateDataSet(set);

            document.getElementById("currentTopicLabel").textContent = getTopicName(set);
            localStorage.setItem(LS_TOPIC_KEY, topicId);
        }

        function loadTopicSelection() {
            const saved = localStorage.getItem(LS_TOPIC_KEY);
            if (saved && trainerInstance) {
                const set = TOPIC_SETS.find(s => s.id === saved);
                if (set) {
                    trainerInstance.updateDataSet(set);
                    document.getElementById("currentTopicLabel").textContent = getTopicName(set);
                }
            }
        }

        function toggleTopics() {
            document.getElementById("topicsDropdown").classList.toggle("show");
        }

        function closeTopicsDropdown() {
            document.getElementById("topicsDropdown")?.classList.remove("show");
        }

        // Close dropdown on outside click
        window.addEventListener("click", function(e) {
            const dropdown = document.getElementById("topicsDropdown");
            const dropdownContainer = dropdown?.parentElement;
            if (dropdownContainer && !dropdownContainer.contains(e.target)) {
                dropdown?.classList.remove("show");
            }
        });

        // Re-init dropdown when language changes
        document.getElementById("prefLang")?.addEventListener("change", () => {
            initTopicDropdown();
            const currentId = localStorage.getItem(LS_TOPIC_KEY) || DEFAULT_SET_ID;
            const set = TOPIC_SETS.find(s => s.id === currentId);
            if (set) {
                document.getElementById("currentTopicLabel").textContent = getTopicName(set);
            }
        });

        // Start the page
        document.addEventListener("DOMContentLoaded", initVocabPage);
    </script>
</body>

</html>
